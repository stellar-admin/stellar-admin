<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token spec concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // ?frame=1[&preset=name]&mode=light|dark[&sample=index] renders one specimen from the token engine
  // (the library's tokens.css + components.css + an optional preset), or, with sample=index, the Dashboard's resource
  // index page instead of the component specimen; ?frame=1&engine=bundle&preset=name renders the
  // shipped bundle for a preset that reproduces one. Without ?frame the page is the comparison shell.
  const params = new URLSearchParams(location.search);
  // Presets, with the shipped bundle each reproduces (if any). The per-theme bundles were removed in
  // phase 3 of the migration, so none has one now and the page shows the token engine only.
  const PRESETS = { base: null, nova: null, concourse: null, ledger: null,
    editorial: null, ops: null, soft: null, terminal: null, workshop: null };
  const FRAME = params.has("frame");
  const preset = params.get("preset") in PRESETS ? params.get("preset") : "base";
  const engine = params.get("engine") === "bundle" && PRESETS[preset] ? "bundle" : "tokens";
  const mode = params.get("mode") === "dark" ? "dark" : "light";
  if (FRAME) {
    document.documentElement.classList.toggle("dark", mode === "dark");
    const sheets = engine === "bundle"
      ? [`../../../src/StellarAdmin.TagHelpers/wwwroot/stellar-admin.${PRESETS[preset]}.css`]
      : ["../../../src/StellarAdmin.TagHelpers/Client/css/tokens.css", "components.css", preset !== "base" && `presets/${preset}.css`].filter(Boolean);
    for (const href of sheets) document.write(`<link rel="stylesheet" href="${href}">`);
  }
</script>
<style>
  /* Page chrome only. Unlayered, and it styles only .demo-* classes, so it never competes with
     either engine. Colours come from the tier 1 tokens; the bundle pane only shows components. */
  .demo-specimen { display: grid; gap: 28px; padding: 24px; max-width: 760px; margin: 0 auto; }
  .demo-section { display: grid; gap: 12px; }
  .demo-h { font: 500 11px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--sa-color-ink-muted); }

  .demo-error { font-size: 12px; color: var(--sa-color-danger-text); }

  .demo-menu[popover] { display: block; position: relative; inset: auto; margin: 0; width: 14rem; opacity: 1; }

  .demo-toasts { display: grid; gap: 12px; max-width: 24rem; }
  .demo-toast.sa-toast { position: relative; inset: auto; height: auto; transform: none; z-index: auto; }
  .demo-switches { gap: 20px; }
  .demo-switch-label { font-size: 14px; gap: 8px; }
  .demo-stage { padding: 32px 16px; background: color-mix(in oklab, var(--sa-color-ink) 6%, var(--sa-color-canvas)); border-radius: 4px; }

  .demo-sidebar-frame { position: relative; height: 560px; overflow: hidden; transform: translateZ(0); box-shadow: 0 0 0 1px var(--sa-color-line); }
  .demo-sidebar-frame .sa-sidebar-wrapper { min-height: 0; height: 100%; }
  .demo-sidebar-frame :is(.sa-sidebar-container, .sa-sidebar-gap) { height: 100%; }
  .demo-brand { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 2rem; height: 2rem; border-radius: 6px; background: var(--sa-color-accent-fill); color: var(--sa-color-on-accent); }
  .demo-brand svg { width: 1rem; height: 1rem; }
  .demo-avatar { background: var(--sa-color-surface-sunken); color: var(--sa-color-ink); }
  .demo-two-line { display: grid; flex: 1; min-width: 0; line-height: 1.25; text-align: left; }
  .demo-two-line b { font-weight: 600; font-size: 0.875rem; }
  .demo-two-line small { font-size: 0.75rem; color: var(--sa-color-ink-muted); }
  .demo-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .demo-search { width: 16rem; max-width: 100%; }
  .demo-actions { width: 1px; white-space: nowrap; }
  .demo-actions .sa-button + .sa-button { margin-inline-start: 4px; }
  .demo-main { padding: 16px; font-size: 13px; color: var(--sa-color-ink-muted); }

  /* Shell */
  body.demo-shell { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  .demo-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e4e4e7; }
  .demo-bar strong { font-weight: 600; margin-right: 8px; }
  .demo-seg { display: inline-flex; border: 1px solid #d4d4d8; border-radius: 6px; overflow: hidden; }
  .demo-seg button { font: inherit; font-size: 13px; padding: 4px 10px; border: 0; background: #fff; color: inherit; cursor: pointer; }
  .demo-seg button + button { border-left: 1px solid #d4d4d8; }
  .demo-seg button[aria-pressed="true"] { background: #18181b; color: #fff; }
  .demo-panes { display: grid; grid-template-columns: repeat(var(--panes, 2), minmax(0, 1fr)); gap: 1px; background: #d4d4d8; }
  .demo-pane { background: #fff; min-width: 0; }
  .demo-pane header { padding: 8px 16px; font-size: 12px; color: #52525b; border-bottom: 1px solid #e4e4e7; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .demo-pane header b { color: #18181b; font-weight: 600; }
  .demo-pane iframe { display: block; width: 100%; border: 0; height: 2400px; }
  @media (max-width: 900px) { .demo-panes { grid-template-columns: 1fr; } }
</style>
</head>

<script>
const ICONS = {

const icon = (name, slot = "") =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${slot ? ` data-icon="${slot}"` : ""}>${ICONS[name]}</svg>`;

// Markup mirrors what the tag helpers emit.
const button = (label, { variant = "default", size = "default", ic, slot = "inline-start", attrs = "" } = {}) =>
  `<button type="button" data-slot="button" class="sa-button group/button sa-button-variant-${variant} sa-button-size-${size}"${attrs}>${ic ? icon(ic, label ? slot : "") : ""}${label}</button>`;
const chip = (label, { code, ic, remove, disabled } = {}) =>
  `<span data-slot="chip" class="sa-chip"${disabled ? " data-disabled" : ""}>${ic ? icon(ic) : ""}${code ? `<code>${code}</code>` : ""}${label}${remove ? `<button type="button" aria-label="Remove ${label}" data-slot="chip-remove" class="sa-button group/button sa-button-variant-ghost sa-button-size-icon-xs sa-chip-remove"${disabled ? " disabled" : ""}>${icon("x")}</button>` : ""}</span>`;
const badge = (label, { variant = "default", ic, href } = {}) => {
  const tag = href ? "a" : "span";
  return `<${tag}${href ? ' href="#"' : ""} data-slot="badge" class="sa-badge group/badge sa-badge-variant-${variant}">${ic ? icon(ic, "inline-start") : ""}${label}</${tag}>`;
};
const switchEl = (label, { checked, size = "default", disabled, invalid } = {}) =>
  `<label class="demo-row demo-switch-label"><span data-slot="switch" data-size="${size}" class="sa-switch-wrapper group/switch"><input type="checkbox" role="switch" data-slot="switch-input" class="sa-switch peer"${checked ? " checked" : ""}${disabled ? " disabled" : ""}${invalid ? ' aria-invalid="true"' : ""}><span data-slot="switch-thumb" class="sa-switch-thumb"></span></span>${label}</label>`;
// A toast as sel-toaster fills the template: only the icon for its type is kept.
const toast = (title, description, { type = "default", action } = {}) => `
  <div data-slot="toast" tabindex="0" role="dialog" aria-modal="false" class="sa-toast demo-toast" data-type="${type}">
    <div data-slot="toast-content" class="sa-toast-content">
      ${type === "default" ? "" : `<span data-slot="toast-icon" class="sa-toast-icon">${icon(type).replace("<svg ", `<svg data-toast-icon="${type}" `)}</span>`}
      <div data-slot="toast-text" class="sa-toast-text"><div data-slot="toast-title" class="sa-toast-title">${title}</div>${description ? `<div data-slot="toast-description" class="sa-toast-description">${description}</div>` : ""}</div>
      ${action ? `<a href="#" data-slot="toast-action" class="sa-toast-action sa-button group/button sa-button-variant-outline sa-button-size-sm">${action}</a>` : ""}
      <button type="button" data-slot="toast-close" aria-label="Close toast" class="sa-toast-close sa-button group/button sa-button-variant-ghost sa-button-size-icon-sm">${icon("x")}</button>
    </div>
  </div>`;
const card = ({ title, description, content, footer, size = "default", attrs = "" }) => `
  <div class="sa-card group/card" data-slot="card" data-size="${size}"${attrs}>
    <div class="sa-card-header" data-slot="card-header">
      <div class="sa-card-title" data-slot="card-title">${title}</div>
      ${description ? `<div class="sa-card-description" data-slot="card-description">${description}</div>` : ""}
    </div>
    <div class="sa-card-content" data-slot="card-content">${content}</div>
    ${footer ? `<div class="sa-card-footer" data-slot="card-footer">${footer}</div>` : ""}
  </div>`;

const item = (label, { ic, shortcut, variant = "default", attrs = "" } = {}) =>
  `<div role="menuitem" tabindex="-1" data-slot="dropdown-menu-item" data-variant="${variant}" class="sa-dropdown-menu-item group/dropdown-menu-item"${attrs}>${ic ? icon(ic) : ""}${label}${shortcut ? `<span data-slot="dropdown-menu-shortcut" class="sa-dropdown-menu-shortcut">${shortcut}</span>` : ""}</div>`;
const checkItem = (label, checked) =>

const sep = `<div role="separator" aria-orientation="horizontal" data-slot="dropdown-menu-separator" class="sa-dropdown-menu-separator"></div>`;
const menu = (extra = "") => `
  <sel-dropdown-menu class="sa-dropdown-menu-content sa-dropdown-menu-content-logical anchored-bottom-span-right w-56 demo-menu${extra}" popover="" role="menu" data-slot="dropdown-menu-content" data-side="bottom">

      ${item("Settings", { ic: "cog", shortcut: "⌘," })}

    ${sep}
    <div data-slot="dropdown-menu-label" class="sa-dropdown-menu-label">Show</div>
    ${checkItem("Flights", true)}${checkItem("Car rental", false)}
    ${sep}
    ${item("Log out", { ic: "logout", variant: "destructive", shortcut: "⇧⌘Q" })}
  </sel-dropdown-menu>`;

const tab = (label, { active, ic } = {}) =>
  `<a href="#" role="tab" data-slot="tabs-trigger" aria-selected="${!!active}"${active ? ' data-active=""' : ""} aria-disabled="false" class="sa-tabs-trigger">${ic ? icon(ic) : ""}${label}</a>`;
const tabs = (variant, withIcons) => `
  <div data-slot="tabs" data-orientation="horizontal" class="sa-tabs group/tabs"><div class="sa-tabs-list group/tabs-list sa-tabs-list-variant-${variant}" data-slot="tabs-list" data-variant="${variant}">
    ${tab("Flights", { ic: withIcons && "plane" })}${tab("Accommodation", { active: true, ic: withIcons && "hotel" })}${tab("Car rental", { ic: withIcons && "ticket" })}

const dialog = `

      </div>
      <div class="demo-fields">
        <div class="demo-field"><label class="demo-label">Name</label><input class="sa-input" data-slot="input" value="Ibn Battuta"></div>
        <div class="demo-field"><label class="demo-label">Username</label><input class="sa-input" data-slot="input" value="@ibnbattuta"></div>
      </div>
      <div data-slot="dialog-footer" class="sa-dialog-footer">${button("Cancel", { variant: "outline" })}${button("Save changes")}</div>
    </dialog>
  </div>`;

const navButton = (label, { ic, active, size = "default", badge, sub } = {}) => `
  <li data-slot="sidebar-menu-item" data-sidebar="menu-item" class="sa-sidebar-menu-item group/menu-item">
    <a href="#" data-slot="sidebar-menu-button" data-sidebar="menu-button" data-size="${size}"${active ? ' data-active="true"' : ""} class="sa-sidebar-menu-button peer/menu-button group/menu-button sa-sidebar-menu-button-size-${size} sa-sidebar-menu-button-variant-default">${icon(ic)}<span>${label}</span></a>
    ${badge ? `<div data-slot="sidebar-menu-badge" data-sidebar="menu-badge" class="sa-sidebar-menu-badge">${badge}</div>` : ""}
    ${sub ? `<ul data-slot="sidebar-menu-sub" data-sidebar="menu-sub" class="sa-sidebar-menu-sub">${sub.map(x => `<li data-slot="sidebar-menu-sub-item" data-sidebar="menu-sub-item" class="sa-sidebar-menu-sub-item group/menu-sub-item"><a href="#" data-slot="sidebar-menu-sub-button" data-sidebar="menu-sub-button" data-size="md" class="sa-sidebar-menu-sub-button"><span>${x}</span></a></li>`).join("")}</ul>` : ""}
  </li>`;
const navGroup = (label, items) => `
  <div data-slot="sidebar-group" data-sidebar="group" class="sa-sidebar-group">
    <div data-slot="sidebar-group-label" data-sidebar="group-label" class="sa-sidebar-group-label">${label}</div>
    <div data-slot="sidebar-group-content" data-sidebar="group-content" class="sa-sidebar-group-content"><ul data-slot="sidebar-menu" data-sidebar="menu" class="sa-sidebar-menu">${items}</ul></div>
  </div>`;
const lgButton = (inner) => `<ul data-slot="sidebar-menu" data-sidebar="menu" class="sa-sidebar-menu"><li data-slot="sidebar-menu-item" data-sidebar="menu-item" class="sa-sidebar-menu-item group/menu-item"><a href="#" data-slot="sidebar-menu-button" data-sidebar="menu-button" data-size="lg" class="sa-sidebar-menu-button peer/menu-button group/menu-button sa-sidebar-menu-button-size-lg sa-sidebar-menu-button-variant-default">${inner}</a></li></ul>`;
const sidebar = `
  <div class="demo-sidebar-frame">
    <sel-sidebar data-slot="sidebar-wrapper" style="--sidebar-width: 16rem; --sidebar-width-icon: 3rem; --sidebar-width-mobile: 18rem" class="sa-sidebar-wrapper group/sidebar-wrapper">

if (FRAME) {
  document.body.innerHTML = engine === "tokens" && params.get("sample") === "index" ? indexPage() : specimen();
  const report = () => parent.postMessage({ tokenSpecHeight: document.documentElement.scrollHeight, engine }, "*");
  addEventListener("load", report);
  new ResizeObserver(report).observe(document.body);
} else {
  document.body.className = "demo-shell";
  const state = { preset, mode, view: params.get("view") || "both" };
  const seg = (key, values) => `<span class="demo-seg" data-key="${key}">${values.map(v => `<button type="button" data-value="${v}">${v}</button>`).join("")}</span>`;
  document.body.innerHTML = `
    <div class="demo-bar">
      <strong>Token spec concept</strong>
      <a href="builder.html" style="font-size:13px">Theme builder →</a>
      ${seg("preset", Object.keys(PRESETS))}
      ${seg("mode", ["light", "dark"])}
      ${seg("view", ["both", "bundle", "tokens"])}
    </div>
    <div class="demo-panes"></div>`;
  const lines = async (url) => { try { return (await (await fetch(url)).text()).split("\n").length; } catch { return "?"; } };
  const render = async () => {
    const bundle = PRESETS[state.preset];
    document.querySelector('[data-key="view"]').hidden = !bundle;
    for (const s of document.querySelectorAll(".demo-seg"))
      for (const b of s.children) b.setAttribute("aria-pressed", String(state[s.dataset.key] === b.dataset.value));
    history.replaceState(null, "", `?preset=${state.preset}&mode=${state.mode}&view=${state.view}`);
    const engines = !bundle ? ["tokens"] : state.view === "both" ? ["bundle", "tokens"] : [state.view];
    const panes = document.querySelector(".demo-panes");
    panes.style.setProperty("--panes", engines.length);
    const presetFile = state.preset === "base" ? null : `presets/${state.preset}.css`;
    panes.innerHTML = engines.map(e => `
      <div class="demo-pane" data-engine="${e}">
        <header>${e === "bundle"
          ? `<span><b>Current</b> · stellar-admin.${bundle}.css</span><span data-count="../../../src/StellarAdmin.TagHelpers/Client/css/themes/${bundle}.css">themes/${bundle}.css: … lines</span>`
          : `<span><b>Token engine</b> · tokens + components${presetFile ? ` + ${presetFile}` : ""}</span>${presetFile ? `<span data-count="${presetFile}">${presetFile}: … lines</span>` : ""}`}</header>
        <iframe title="${e}" src="?frame=1&engine=${e}&preset=${state.preset}&mode=${state.mode}"></iframe>
      </div>`).join("");
    for (const el of panes.querySelectorAll("[data-count]")) {
      const n = await lines(el.dataset.count);
      el.textContent = el.textContent.replace("…", n);
    }
  };
  document.body.addEventListener("click", (e) => {
    const b = e.target.closest(".demo-seg button");
    if (!b) return;
    state[b.parentElement.dataset.key] = b.dataset.value;
    render();
  });
  addEventListener("message", (e) => {
    if (!e.data?.tokenSpecHeight) return;
    const frame = document.querySelector(`.demo-pane[data-engine="${e.data.engine}"] iframe`);
    if (frame) frame.style.height = `${e.data.tokenSpecHeight}px`;
  });
  render();
}
