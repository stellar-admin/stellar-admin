# A trip's edit page with its upcoming departures beside the form, in light and dark
scenario: widgets-edit-page
steps:
  - viewport: { width: 1440, height: 760 }
  - goto: /stellaradmin/trips/edit/1
  - expectVisible: { selector: ".sa-card-title:has-text('Upcoming departures')", timeout: 5000 }
  - screenshot: widgets-edit-page
  - colorScheme: dark
  - screenshot: widgets-edit-page-dark
