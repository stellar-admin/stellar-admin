# The trip's tags as a checkbox group in three columns with the trip's tags checked, cropped to the field, in light and dark
scenario: many-to-many-choice
steps:
  # Wide enough for the field to reach 40rem and display three columns
  - viewport: { width: 1280, height: 800 }
  - goto: /stellaradmin/trips/edit/1
  - screenshot: { name: many-to-many-choice, locator: "[data-slot='field']:has(label:text-is('Tags'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: many-to-many-choice-dark, locator: "[data-slot='field']:has(label:text-is('Tags'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
