# The trips grid with the second row being edited, its icon as a button that opens the picker, in light and dark
scenario: icon-editor-inline-row
steps:
  - goto: /stellaradmin/trips
  - click: "tr[data-key='2'] button[data-row-edit]"
  - expectVisible: { role: button, name: Save }
  # Parks the pointer on the sidebar, which stays put when the shot scrolls the page
  - hover: .sa-sidebar-brand-title
  - screenshot: { name: icon-editor-inline-row, locator: "#index-page-grid", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: icon-editor-inline-row-dark, locator: "#index-page-grid", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
