# The destinations grid with hero image thumbnails, with the page title, in light and dark
scenario: image-display-thumbnails
steps:
  - goto: /stellaradmin/destinations
  - expectVisible: "img[src$='amalfi-coast.webp']"
  - screenshot: { name: image-display-thumbnails, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
  - colorScheme: dark
  - screenshot: { name: image-display-thumbnails-dark, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
