# The first trip card's fields in the grid layout, in light and dark
scenario: cards-field-layout-grid
steps:
  # Two columns of cards, so the stats have room for their values
  - viewport: { width: 1120, height: 800 }
  - goto: /stellaradmin/trips
  - expectVisible: ".sa-resource-card[data-key='1'] .sa-resource-card-fields"
  - screenshot: { name: cards-field-layout-grid, locator: ".sa-resource-card[data-key='1'] .sa-resource-card-fields", margin: { top: 8, right: 16, bottom: 16, left: 16 } }
  - colorScheme: dark
  - screenshot: { name: cards-field-layout-grid-dark, locator: ".sa-resource-card[data-key='1'] .sa-resource-card-fields", margin: { top: 8, right: 16, bottom: 16, left: 16 } }
