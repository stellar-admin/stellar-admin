# The sidebar with a red link to a page that doesn't exist, boxed, in light and dark
scenario: sidebar-missing-link
steps:
  # A short window, so the sidebar crop ends below its last item
  - viewport: { width: 1280, height: 340 }
  - goto: /stellaradmin
  - annotate: { locator: ".sa-sidebar-menu-item:has-text('Reports')" }
  - screenshot: { name: sidebar-missing-link, locator: .sa-sidebar-inner }
  - colorScheme: dark
  - screenshot: { name: sidebar-missing-link-dark, locator: .sa-sidebar-inner }
