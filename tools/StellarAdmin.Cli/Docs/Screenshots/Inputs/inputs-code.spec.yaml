# A guide's badge code input, in light and dark
scenario: inputs-code
steps:
  # Narrow, so the field isn't too wide
  - viewport: { width: 480, height: 480 }
  - goto: /stellaradmin/guides/edit/1
  - screenshot: { name: inputs-code, locator: "[data-slot='field']:has(label:text-is('Badge code'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: inputs-code-dark, locator: "[data-slot='field']:has(label:text-is('Badge code'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
