# A trip's base price with its euro prefix, and an empty phone number with its placeholder, in light and dark
scenario: inputs-text
steps:
  # Narrow, so the fields aren't too wide
  - viewport: { width: 480, height: 480 }
  - goto: /stellaradmin/trips/edit/1
  - screenshot: { name: inputs-text-price, locator: "[data-slot='field']:has(label:text-is('Base price'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: inputs-text-price-dark, locator: "[data-slot='field']:has(label:text-is('Base price'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - goto: /stellaradmin/travellers/edit/1
  - colorScheme: light
  # Empty, so the placeholder shows, and unfocused, so the input has no focus ring
  - fill: { locator: "input[type='tel']", text: "" }
  - click: "h1"
  - screenshot: { name: inputs-text-phone, locator: "[data-slot='field']:has(label:text-is('Phone'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: inputs-text-phone-dark, locator: "[data-slot='field']:has(label:text-is('Phone'))", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
