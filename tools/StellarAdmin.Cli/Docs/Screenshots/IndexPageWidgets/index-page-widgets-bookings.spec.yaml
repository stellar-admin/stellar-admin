# The bookings index page with totals above the grid and upcoming departures beside it, in light and dark
scenario: index-page-widgets-bookings
steps:
  - viewport: { width: 1440, height: 760 }
  - goto: /stellaradmin/bookings?scope=pending
  - expectVisible: { selector: "text=Bookings listed", timeout: 5000 }
  - expectVisible: { selector: ".sa-card-title:has-text('Upcoming departures')", timeout: 5000 }
  - screenshot: index-page-widgets-bookings
  - colorScheme: dark
  - screenshot: index-page-widgets-bookings-dark
