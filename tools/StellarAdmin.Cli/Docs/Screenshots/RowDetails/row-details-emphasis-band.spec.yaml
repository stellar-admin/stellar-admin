# VB-100553 expanded with the Band emphasis, in light and dark
scenario: row-details-emphasis-band
steps:
  - goto: /stellaradmin/bookings
  - click: "tr:has-text('VB-100553') button[data-slot='table-row-detail-toggle']"
  - expectVisible: { selector: "[data-slot='table-row-detail'][data-state='open']", timeout: 3000 }
  # Parks the pointer on the sidebar, which stays put when the shot scrolls the page
  - hover: .sa-sidebar-brand-title
  - screenshot: { name: row-details-emphasis-band, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
  - colorScheme: dark
  - screenshot: { name: row-details-emphasis-band-dark, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
