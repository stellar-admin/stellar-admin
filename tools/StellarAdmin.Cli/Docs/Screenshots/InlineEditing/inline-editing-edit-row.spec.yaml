# The destinations grid with the second row being edited and the other rows dimmed, in light and dark
scenario: inline-editing-edit-row
steps:
  - goto: /stellaradmin/destinations
  - click: "tr[data-key='2'] button[data-row-edit]"
  - expectVisible: { role: button, name: Save }
  # Parks the pointer on the sidebar, which stays put when the shot scrolls the page
  - hover: .sa-sidebar-brand-title
  - screenshot: { name: inline-editing-edit-row, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
  - colorScheme: dark
  - screenshot: { name: inline-editing-edit-row-dark, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
