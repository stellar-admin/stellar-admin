# A new row at the bottom of the destinations grid, added with the grid's Create button, with a box around it, in
# light and dark
scenario: inline-editing-new-row
steps:
  - goto: /stellaradmin/destinations
  - click: "button[data-row-add]"
  - expectVisible: "tr[data-key='new']"
  # Parks the pointer on the sidebar, which stays put when the shot scrolls the page
  - hover: .sa-sidebar-brand-title
  - annotate: { locator: "tr[data-key='new']" }
  - screenshot: { name: inline-editing-new-row, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
  - colorScheme: dark
  - screenshot: { name: inline-editing-new-row-dark, locator: "#index-page-grid", margin: { top: 72, right: 32, bottom: 32, left: 32 } }
