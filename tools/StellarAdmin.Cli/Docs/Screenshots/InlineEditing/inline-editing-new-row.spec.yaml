# The grid's Create button clicked and a new row added to the destinations grid, recorded as a GIF in light and dark
scenario: inline-editing-new-row
steps:
  - goto: /stellaradmin/destinations
  - record: { name: inline-editing-new-row, gif: true }
  - pause: 600
  - click: "button[data-row-add]"
  - expectVisible: "tr[data-key='new']"
  - pause: 1200
  - recordEnd: true
  - press: Escape
  - expectCount: { selector: "tr[data-key='new']", count: 0 }
  - colorScheme: dark
  - record: { name: inline-editing-new-row-dark, gif: true }
  - pause: 600
  - click: "button[data-row-add]"
  - expectVisible: "tr[data-key='new']"
  - pause: 1200
  - recordEnd: true
