# The bookings grid's header and first five rows, with the first row's view, edit and delete actions boxed, in light and dark
scenario: index-pages-row-actions
steps:
  - goto: /stellaradmin/bookings
  - expectCount: { selector: "tbody tr", count: 5 }
  - annotate: { locator: "tbody tr:first-child td:last-child" }
  - screenshot: { name: index-pages-row-actions, locator: table, margin: { top: 16, right: 16, bottom: 1, left: 16 } }
  - colorScheme: dark
  - screenshot: { name: index-pages-row-actions-dark, locator: table, margin: { top: 16, right: 16, bottom: 1, left: 16 } }
