# The By day data layout selected, with the first days of bookings under the controls row, in light and dark
scenario: partial-views-by-day
steps:
  # A short window, so the shot ends after the first three days
  - viewport: { width: 1280, height: 520 }
  # The partial view has no paging, so a search keeps it to ten bookings over a few days
  - goto: /stellaradmin/bookings?layout=by-day&search=VB-10000
  - screenshot: partial-views-by-day
  - colorScheme: dark
  - screenshot: partial-views-by-day-dark
