# The difficulty as a radio group of cards in three columns, each with its title and description, Moderate
# selected, cropped to the field, in light and dark
scenario: choice-editors-cards
steps:
  # Wide enough for the field to reach 40rem and display three columns
  - viewport: { width: 1280, height: 480 }
  - goto: /stellaradmin/trips/create
  - screenshot: { name: choice-editors-cards, locator: "[data-slot='field-set']:has(legend:text-is('Difficulty'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: choice-editors-cards-dark, locator: "[data-slot='field-set']:has(legend:text-is('Difficulty'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
