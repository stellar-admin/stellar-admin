# The home airport as a radio group of a fixed list of airports, Kyoto selected, in light and dark
scenario: choice-editors-items
steps:
  # Narrow, so the field isn't too wide
  - viewport: { width: 480, height: 480 }
  - goto: /stellaradmin/guides/create
  - click: { role: radio, name: Kyoto }
  - screenshot: { name: choice-editors-items, locator: "[data-slot='field-set']:has(legend:text-is('Home airport'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: choice-editors-items-dark, locator: "[data-slot='field-set']:has(legend:text-is('Home airport'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
