# The transport toggle group with an icon beside each option, Train selected, in light and dark
scenario: choice-editors-media
steps:
  # A short window, so the page crop ends below the form
  - viewport: { width: 1280, height: 320 }
  - goto: /stellaradmin/trips/create
  # The radio input is visually hidden, so click its label
  - click: "label:has(input[value='Train'])"
  - screenshot: { name: choice-editors-media, locator: main }
  - colorScheme: dark
  - screenshot: { name: choice-editors-media-dark, locator: main }
