# The destinations grid with the second row being edited, its hero image as a thumbnail button, in light and dark
scenario: image-editor-inline-row
steps:
  - goto: /stellaradmin/destinations
  - expectVisible: "img[src$='amalfi-coast.webp']"
  - click: "tr[data-key='2'] button[data-row-edit]"
  - expectVisible: { role: button, name: Save }
  # Parks the pointer on the sidebar, which stays put when the shot scrolls the page
  - hover: .sa-sidebar-brand-title
  - screenshot: { name: image-editor-inline-row, locator: "#index-page-grid", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: image-editor-inline-row-dark, locator: "#index-page-grid", margin: { top: 16, right: 24, bottom: 24, left: 24 } }
