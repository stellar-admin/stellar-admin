# Tokyo's hero image in the dropzone layout, cropped to the field, in light and dark
scenario: image-editor-intro
steps:
  # Narrow, so the crop ends near the dropzone's right edge
  - viewport: { width: 404, height: 800 }
  - goto: /stellaradmin/destinations/edit/2
  - expectVisible: "img[src$='tokyo.webp']"
  - screenshot: { name: image-editor-intro, locator: "[data-slot='field']:has(label:text-is('Hero image URL'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: image-editor-intro-dark, locator: "[data-slot='field']:has(label:text-is('Hero image URL'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
