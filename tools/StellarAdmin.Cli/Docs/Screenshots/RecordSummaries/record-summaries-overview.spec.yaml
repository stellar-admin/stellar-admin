# A trip's view page header with its code, destination and difficulty badge under the title, in light and dark
scenario: record-summaries-overview
steps:
  - viewport: { width: 1280, height: 420 }
  - goto: /stellaradmin/trips/view/1
  - expectVisible: "[data-slot='page-summary']"
  - screenshot: { name: record-summaries-overview, locator: "[data-slot='page-header']", margin: { top: 8, right: 8, bottom: 8, left: 8 } }
  - colorScheme: dark
  - screenshot: { name: record-summaries-overview-dark, locator: "[data-slot='page-header']", margin: { top: 8, right: 8, bottom: 8, left: 8 } }
