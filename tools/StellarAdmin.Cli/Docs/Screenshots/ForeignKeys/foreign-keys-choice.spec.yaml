# The trip's lead guide as a radio group of the guides in three columns, cropped to the field, in light and dark
scenario: foreign-keys-choice
steps:
  # Wide enough for the field to display three columns
  - viewport: { width: 1280, height: 1200 }
  - goto: /stellaradmin/trips/edit/1
  - screenshot: { name: foreign-keys-choice, locator: "[data-slot='field-set']:has(legend:text-is('Lead guide'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: foreign-keys-choice-dark, locator: "[data-slot='field-set']:has(legend:text-is('Lead guide'))", margin: { top: 16, right: 24, bottom: 12, left: 24 } }
