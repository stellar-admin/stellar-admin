# The traveller lookup with its New button beside Choose traveller, in light and dark
scenario: foreign-keys-create
steps:
  - goto: /stellaradmin/bookings/create
  - expectVisible: { selector: "[data-slot='field']:has(label:text-is('Traveller')) >> role=button[name='New']", timeout: 3000 }
  - screenshot: { name: foreign-keys-create, locator: "[data-slot='field']:has(label:text-is('Traveller'))", margin: { top: 16, right: 24, bottom: 16, left: 24 } }
  - colorScheme: dark
  - screenshot: { name: foreign-keys-create-dark, locator: "[data-slot='field']:has(label:text-is('Traveller'))", margin: { top: 16, right: 24, bottom: 16, left: 24 } }
