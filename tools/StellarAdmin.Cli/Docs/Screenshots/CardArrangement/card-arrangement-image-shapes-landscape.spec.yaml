# The first trip card with a landscape image, in light and dark
scenario: card-arrangement-image-shapes-landscape
steps:
  - goto: /stellaradmin/trips
  - expectVisible: ".sa-resource-card[data-key='1'] img"
  - screenshot: { name: card-arrangement-image-shapes-landscape, locator: ".sa-resource-card[data-key='1']", margin: 16 }
  - colorScheme: dark
  - screenshot: { name: card-arrangement-image-shapes-landscape-dark, locator: ".sa-resource-card[data-key='1']", margin: 16 }
