name: Build and Test

# Build and test the complete product from this checkout. Release verification uses
# release.yml; opt-in publishing is owned by that workflow.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Validate consumer skills
      run: |
        npm ci --prefix build/skill-validation --ignore-scripts --no-audit --no-fund
        npm test --prefix build/skill-validation
        npm run check --prefix build/skill-validation

    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Check consumer reference drift
      run: dotnet run --project util/SkillsGenerator --no-build --configuration Release -- --check

    - name: Run tag helper tests
      run: dotnet run --project tests/StellarAdmin.TagHelpers.Tests --no-build --configuration Release

    - name: Run resource integration tests
      run: dotnet run --project tests/StellarAdmin.Dashboard.EntityFrameworkCore.Tests --no-build --configuration Release
