name: Build and Test

# Build and test the complete product from this checkout. Releases are orchestrated
# by the workspace repository.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tag helper tests
      run: dotnet run --project tests/StellarAdmin.TagHelpers.Tests --no-build --configuration Release

    - name: Run resource integration tests
      run: dotnet run --project tests/StellarAdmin.Pro.EntityFrameworkCore.Tests --no-build --configuration Release
