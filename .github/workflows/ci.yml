name: Build and Test

# Push/PR build for the OSS repo. Releases are cut by the cross-repo release workflow in
# the stellar-admin/workspace repo, which builds this repo together with the pro repo,
# packs every package with one version, publishes, and creates the GitHub Release here.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release
