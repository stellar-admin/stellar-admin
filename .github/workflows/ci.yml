name: Build and Test

# Build and test the active solution, including EF Core integration tests, through the verify action.
# Release verification uses release.yml; opt-in publishing is owned by that workflow.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and test
      uses: ./.github/actions/verify
