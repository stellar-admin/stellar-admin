name: Release
run-name: Release ${{ inputs.version }}${{ inputs.publish && ' (publish)' || ' (dry run)' }}

# Build and verify all five packages. Publishing is opt-in and limited to Core and TagHelpers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (SemVer without leading v or build metadata)"
        required: true
        type: string
      publish:
        description: "Publish Core and TagHelpers to NuGet (unchecked runs verification only)"
        required: false
        default: false
        type: boolean

# Serialize entire publishing runs, including retries; never cancel an active publication.
concurrency:
  group: release-${{ inputs.publish && 'publish' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: ${{ inputs.version }}
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    name: Build, pack and verify
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          NUMBER='(0|[1-9][0-9]*)'
          IDENTIFIER="($NUMBER|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          if ! [[ "$VERSION" =~ ^$NUMBER\.$NUMBER\.$NUMBER(-$IDENTIFIER(\.$IDENTIFIER)*)?$ ]]; then
            echo "::error::Use SemVer without a leading v or build metadata."
            exit 1
          fi

      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record built commit
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Release verification"
            echo
            printf 'Version: %s\n\nCommit: %s\n' "$VERSION" "$sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install client dependencies
        shell: bash
        run: |
          for client in \
            src/StellarAdmin.TagHelpers/Client \
            src/StellarAdmin.Dashboard/Client \
            docs/DocsSamples/Client \
            sandbox/ComponentPlayground/Client \
            sandbox/IdentitySimplePlayground/Client
          do
            npm ci --prefix "$client"
          done

      - name: Build product solution
        run: >
          dotnet build StellarAdmin.slnx --configuration Release -m:1
          -p:Version="$VERSION"
          -p:ContinuousIntegrationBuild=true
          -p:AllowMissingPrunePackageData=true

      - name: Pack packages
        shell: bash
        run: |
          for package in StellarAdmin.Core StellarAdmin.TagHelpers StellarAdmin.Dashboard StellarAdmin.Dashboard.Identity StellarAdmin.Dashboard.EntityFrameworkCore; do
            dotnet pack "src/$package/$package.csproj" --configuration Release --no-build \
              --output "$ARTIFACTS_DIR" \
              -p:Version="$VERSION" \
              -p:PackageVersion="$VERSION" \
              -p:ContinuousIntegrationBuild=true \
              -p:AllowMissingPrunePackageData=true \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg
          done

      - name: Validate packages
        shell: bash
        run: |
          for package in StellarAdmin.Core StellarAdmin.TagHelpers StellarAdmin.Dashboard StellarAdmin.Dashboard.Identity StellarAdmin.Dashboard.EntityFrameworkCore; do
            dotnet meziantou.validate-nuget-package "$ARTIFACTS_DIR/$package.$VERSION.nupkg"
          done

      - name: Run tag helper tests
        run: dotnet run --project tests/StellarAdmin.TagHelpers.Tests --no-build --configuration Release

      - name: Run resource integration tests
        run: dotnet run --project tests/StellarAdmin.Dashboard.EntityFrameworkCore.Tests --no-build --configuration Release

      - name: Check consumer reference drift
        run: dotnet run --project util/SkillsGenerator --no-build --configuration Release -- --check

      - name: Smoke-test packages as a consumer
        run: build/smoke-test.sh "$VERSION" "$ARTIFACTS_DIR"

      - name: Upload verified packages
        id: packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ inputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Core and TagHelpers
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: write
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      PUBLISH_PACKAGES: StellarAdmin.Core StellarAdmin.TagHelpers
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      TAG: v${{ inputs.version }}

    steps:
      - name: Check publishing configuration
        env:
          PUBLISHING_ENABLED: ${{ vars.RELEASE_PUBLISHING_ENABLED }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ "$PUBLISHING_ENABLED" != true || -z "$NUGET_USER" ]]; then
            echo "::error::Finish the publishing cutover and configure NUGET_USER before publishing."
            exit 1
          fi

      - name: Checkout built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true

      # A draft reserves the version and binds retries to this run's immutable artifact.
      # Recover with "Re-run failed jobs" on this run; never dispatch a rebuild to retry a push.
      - name: Check version and reserve release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            const sha = process.env.SOURCE_SHA;
            const artifact = process.env.ARTIFACT_ID;
            const tag = process.env.TAG;
            const repo = context.repo;
            if (!/^[0-9a-f]{40}$/.test(sha) || !/^[0-9]+$/.test(artifact)) {
              throw new Error('Missing built SHA or verified artifact ID.');
            }

            function parse(value) {
              const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$/.exec(value);
              return match && { core: match.slice(1, 4).map(BigInt), pre: match[4]?.split('.') };
            }
            function compare(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a.core[i] !== b.core[i]) return a.core[i] > b.core[i] ? 1 : -1;
              }
              if (!a.pre || !b.pre) return a.pre ? -1 : b.pre ? 1 : 0;
              for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
                const x = a.pre[i], y = b.pre[i];
                if (x === undefined || y === undefined) return x === undefined ? -1 : 1;
                if (x === y) continue;
                const xn = /^[0-9]+$/.test(x), yn = /^[0-9]+$/.test(y);
                if (xn && yn) return BigInt(x) > BigInt(y) ? 1 : -1;
                if (xn !== yn) return xn ? -1 : 1;
                return x > y ? 1 : -1;
              }
              return 0;
            }
            const requested = parse(version);
            if (!requested) throw new Error('Invalid SemVer.');
            const marker = `<!-- stellar-admin-release run=${context.runId} sha=${sha} artifact=${artifact} -->`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === tag);
            if (release && release.body !== marker) {
              throw new Error('This version belongs to another release run. Retry the original failed publish job.');
            }

            let existingTag;
            try {
              existingTag = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existingTag) {
              const commit = await github.rest.repos.getCommit({ ...repo, ref: `tags/${tag}` });
              if (commit.data.sha !== sha || !release) {
                throw new Error('Existing tag does not belong to this release run and SHA.');
              }
            }

            const tags = await github.paginate(github.rest.repos.listTags, { ...repo, per_page: 100 });
            const versions = tags.filter(item => item.name.startsWith('v')).map(item => item.name.slice(1));
            for (const name of process.env.PUBLISH_PACKAGES.split(' ')) {
              const response = await fetch(`https://api.nuget.org/v3-flatcontainer/${name.toLowerCase()}/index.json`);
              if (response.status === 404) continue;
              if (!response.ok) throw new Error(`Cannot check NuGet versions: HTTP ${response.status}`);
              versions.push(...(await response.json()).versions);
            }
            for (const value of versions) {
              const previous = parse(value);
              if (!previous) continue; // Ignore unrelated tags and legacy non-SemVer versions.
              const order = compare(requested, previous);
              if (order < 0 || (order === 0 && !release)) {
                throw new Error(`Version must be newer than ${value}; same-version retries require the original run and artifact.`);
              }
            }

            const reserved = release ?? (await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: sha, name: tag,
              body: marker, draft: true, prerelease: version.includes('-')
            })).data;
            core.setOutput('release_id', reserved.id);
            if (!existingTag) {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            }

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in $PUBLISH_PACKAGES; do
            dotnet nuget push "artifacts/$package.$VERSION.nupkg" \
              --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate --no-symbols
            dotnet nuget push "artifacts/$package.$VERSION.snupkg" \
              --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Attach published packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "artifacts/StellarAdmin.Core.$VERSION.nupkg" \
            "artifacts/StellarAdmin.Core.$VERSION.snupkg" \
            "artifacts/StellarAdmin.TagHelpers.$VERSION.nupkg" \
            "artifacts/StellarAdmin.TagHelpers.$VERSION.snupkg"

      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              prerelease: process.env.VERSION.includes('-'),
              make_latest: process.env.VERSION.includes('-') ? 'false' : 'true'
            });

      - name: Summary
        run: |
          {
            echo "## Published $VERSION"
            echo
            echo "- Packages: $PUBLISH_PACKAGES"
            echo "- Source commit: $SOURCE_SHA"
            echo "- Verified artifact: $ARTIFACT_ID"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
