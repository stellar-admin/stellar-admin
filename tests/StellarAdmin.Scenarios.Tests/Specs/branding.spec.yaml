# The sidebar header shows the configured title, subtitle and icon
scenario: branding
steps:
  - goto: /stellaradmin
  - expectText: { selector: ".sa-sidebar-brand-title", text: Voyager Travel }
  - expectText: { selector: ".sa-sidebar-brand-subtitle", text: Operations }
  - expectVisible: ".sa-sidebar-brand-mark > svg"
  - screenshot: branding
  - screenshot: { name: branding-brand, locator: "a:has(.sa-sidebar-brand-mark)" }
  - annotate: { locator: "a:has(.sa-sidebar-brand-mark)", label: "Your title and logo" }
  - screenshot: branding-annotated
  - clearAnnotations: true
  - colorScheme: dark
  - screenshot: branding-dark
  - screenshot: { name: branding-brand-dark, locator: "a:has(.sa-sidebar-brand-mark)" }
  - viewport: { width: 390, height: 844 }
  - screenshot: branding-mobile-dark
  - colorScheme: light
  - screenshot: branding-mobile
