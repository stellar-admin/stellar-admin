# The sidebar link opens the trips index with its rows
scenario: default
steps:
  - goto: /stellaradmin
  - expectText: { role: heading, name: Welcome to StellarAdmin, text: Welcome to StellarAdmin }
  - screenshot: default
  - click: { role: link, name: Trips }
  - expectUrl: /stellaradmin/trips
  - expectText: { role: heading, name: Trips, text: Trips }
  - expectVisible: { role: cell, name: Kyoto in autumn }
  - screenshot: trips-index
