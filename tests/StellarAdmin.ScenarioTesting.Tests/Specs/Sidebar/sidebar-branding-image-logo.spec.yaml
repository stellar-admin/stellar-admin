# An image logo shows beside the title in the sidebar header, with no light or dark variant
scenario: sidebar-branding-image-logo
steps:
  - goto: /stellaradmin
  - expectAttribute: { selector: "[data-slot='sidebar-header'] [data-slot='sidebar-menu-button'] img.sa-sidebar-brand-logo", attribute: src, value: /img/logo.svg }
  - expectCount: { selector: "[data-slot='sidebar-header'] [data-slot='sidebar-menu-button'] img.sa-sidebar-brand-logo[data-scheme]", count: 0 }
  - expectVisible: "[data-slot='sidebar-header'] [data-slot='sidebar-menu-button'] .sa-sidebar-brand-title"
