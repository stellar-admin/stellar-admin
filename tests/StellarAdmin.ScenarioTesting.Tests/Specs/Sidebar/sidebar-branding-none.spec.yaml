# With no branding, the sidebar header links home and shows the title from the application name, with no subtitle or logo
scenario: sidebar-branding-none
steps:
  - goto: /stellaradmin
  - within:
      selector: "[data-slot='sidebar-header'] a"
      steps:
        - expectAttribute: { attribute: href, value: /stellaradmin }
        - expectText: { selector: .sa-sidebar-brand-title, text: "/^Stellar Admin /" }
        - expectCount: { selector: .sa-sidebar-brand-subtitle, count: 0 }
        - expectCount: { selector: ":is(.sa-sidebar-brand-mark, img)", count: 0 }
