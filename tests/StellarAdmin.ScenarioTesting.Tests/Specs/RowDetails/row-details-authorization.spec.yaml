# A row expanded after the session ends reloads the page, which goes to sign in and comes back to the bookings
scenario: row-details-authorization
user: admin@voyager.travel
steps:
  - goto: /stellaradmin/bookings
  - signOut: true
  - click: { selector: "tr:has-text('VB-101459') [data-slot='table-row-detail-toggle']", timeout: 5000 }
  - expectUrl: { url: /scenario/sign-in?ReturnUrl=%2Fstellaradmin%2Fbookings, timeout: 5000 }
  - expectRequests: { url: /stellaradmin/bookings/rowdetail/1, count: 1, status: 204 }
